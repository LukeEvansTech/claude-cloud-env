---
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level: read-only by default (CKV2_GHA_1).
permissions:
  contents: read

jobs:
  lint:
    # Per-job: explicit write scopes for super-linter.
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@4ad6729e601bf0b89eb08d8bf6ebc0e9cf91b775 # v1
    with:
      # Graduated from soft-launch. A full-codebase super-linter pass over all 8
      # tracked files (VALIDATE_ALL_CODEBASE=true, run locally with this repo's
      # exact CI config) reported zero findings, so blocking costs nothing and
      # keeps it that way.
      soft-launch: false
